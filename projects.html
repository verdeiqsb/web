<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - VerdeIQ Sdn Bhd</title>
    <link rel="icon" type="image/png" href="app.png">
    <meta name="description" content="Explore VerdeIQ's past projects and case studies in intelligent systems.">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
</head>
<body>
    <div data-include="includes/header.html"></div>

    <!-- Page Header -->
    <section class="page-header">
        <div class="container">
            <h1 class="page-title">Projects</h1>
            <p class="page-subtitle">Past Projects & Case Studies</p>
        </div>
    </section>

    <!-- Search and Filter Section -->
    <section class="content-section filter-section">
        <div class="container">
            <div class="filter-card">
                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="all">All Projects</button>
                        <button class="filter-btn" data-filter="facility"><span class="material-symbols-outlined icon-svg filter-icon">apartment</span> Facility</button>
                        <button class="filter-btn" data-filter="environment"><span class="material-symbols-outlined icon-svg filter-icon">humidity_indoor</span> Environment</button>
                        <button class="filter-btn" data-filter="electrical"><span class="material-symbols-outlined icon-svg filter-icon">flash_on</span> Electrical</button>
                        <button class="filter-btn" data-filter="agriculture"><span class="material-symbols-outlined icon-svg filter-icon">temp_preferences_eco</span> Agriculture</button>
                        <button class="filter-btn" data-filter="flood"><span class="material-symbols-outlined icon-svg filter-icon">flood</span> Flood Mitigation</button>
                        <button class="filter-btn" data-filter="future"><span class="material-symbols-outlined icon-svg filter-icon">rocket_launch</span> Future Projects</button>
                </div>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Search projects by name, domain, or technology..." class="search-input">
                    <span class="search-icon"><span class="material-symbols-outlined icon-svg">search</span></span>
                </div>
            </div>
        </div>
    </section>

    <!-- Projects Grid -->
    <section class="content-section">
        <div class="container">
            <div id="projectsContainer" class="projects-container">
                <!-- Projects will be dynamically inserted here -->
            </div>
            <div id="noResults" class="no-results" style="display: none;">
                <p>No projects found matching your search criteria.</p>
            </div>
        </div>
    </section>

    <div data-include="includes/footer.html"></div>

    <script src="include.js"></script>
    <script src="script.js"></script>
</body>
</html>
